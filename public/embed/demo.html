<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI 영상 업로드 페이지 (가상 데모)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 880px; margin: 32px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 24px; }
    .panel { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; margin: 16px 0; }
    .upload-box { border: 2px dashed #9ca3af; background: #fff; padding: 32px; text-align: center; border-radius: 8px; }
    button { background: #4f46e5; color: #fff; padding: 8px 16px; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .log { background: #1f2937; color: #d1d5db; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; height: 120px; overflow:auto; }
  </style>
</head>
<body>
  <h1>🎬 가상 영상 플랫폼 (임베드 데모)</h1>
  <p>이 페이지는 외부 호스트 사이트를 흉내냅니다. 아래에 <code>copyright-widget.js</code>를 삽입했습니다.</p>

  <div class="panel">
    <h3 style="margin-top:0">1단계 — AI 콘텐츠 저작권 검증</h3>
    <p style="font-size:14px;color:#4b5563">영상을 업로드하기 전, AI 생성 콘텐츠의 저작권 위험도를 확인합니다.</p>

    <div
      data-aicw-widget
      data-api-key="embed-test-key-001"
      data-types="video,image,audio,text"
      data-title="AI 영상 저작권 검사"
      data-block-on-high-risk="true">
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0">2단계 — 영상 업로드 (모의)</h3>
    <div class="upload-box">
      <p>실제 영상 업로드 폼이 여기에 표시됩니다.</p>
      <button id="uploadBtn" disabled>업로드 (저작권 검사 통과 후 활성화)</button>
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0">이벤트 로그 (호스트 사이트가 수신)</h3>
    <div id="log" class="log">위젯이 발신하는 aicw:result / aicw:passed / aicw:blocked 이벤트를 수신합니다.</div>
  </div>

  <script src="/embed/copyright-widget.js"></script>
  <script>
    var log = document.getElementById('log');
    var btn = document.getElementById('uploadBtn');
    function append(msg) {
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }
    document.addEventListener('aicw:result', function (e) {
      append('result: risk=' + e.detail.result.overallRisk + ', matches=' + e.detail.result.matchCount);
    });
    document.addEventListener('aicw:passed', function (e) {
      append('passed → 업로드 버튼 활성화');
      btn.disabled = false;
    });
    document.addEventListener('aicw:blocked', function (e) {
      append('blocked → 업로드 차단');
      btn.disabled = true;
    });
  </script>
</body>
</html>
